name: C11 host tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure host tests
        run: >
          cmake -S . -B build/host
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=Debug
          -DAS608_BUILD_TESTS=ON
      - name: Build host tests and header contracts
        run: cmake --build build/host --parallel
      - name: Run CTest
        run: ctest --test-dir build/host --output-on-failure
      - name: Build standalone C library
        run: |
          cmake -S . -B build/core -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Release -DAS608_BUILD_TESTS=OFF
          cmake --build build/core --parallel
