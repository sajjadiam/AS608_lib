          ./build/test_enroll
          ${{ matrix.compiler }} -std=c11 -Wall -Wextra -Werror -pedantic -I. as608_packet.c as608_transaction.c as608.c test_as608_identify.c -o build/test_identify
          ./build/test_identify
          ${{ matrix.compiler }} -std=c11 -Wall -Wextra -Werror -pedantic -I. as608_packet.c as608_transaction.c as608.c test_as608_high_speed_search.c -o build/test_high_speed_search
          ./build/test_high_speed_search
          ${{ matrix.compiler }} -std=c11 -Wall -Wextra -Werror -pedantic -I. as608_packet.c as608_transaction.c as608.c test_as608_upload_feature.c -o build/test_upload_feature
          ./build/test_upload_feature
          ${{ matrix.compiler }} -std=c11 -Wall -Wextra -Werror -pedantic -I. as608_packet.c as608_transaction.c as608.c test_as608_download_feature.c -o build/test_download_feature
