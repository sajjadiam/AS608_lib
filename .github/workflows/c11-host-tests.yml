name: C11 host tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unified non-blocking tests
        run: |
          set -eu
          mkdir -p build
          ${{ matrix.compiler }} -std=c11 -Wall -Wextra -Werror -pedantic -I. as608_packet.c as608_transaction.c test_as608_transaction.c -o build/test_transaction
          ./build/test_transaction
          for suite in packet commands async async_faults; do
            ${{ matrix.compiler }} -std=c11 -Wall -Wextra -Werror -pedantic -I. as608_packet.c as608_transaction.c as608.c test_as608_${suite}.c -o build/test_${suite}
            ./build/test_${suite}
          done
